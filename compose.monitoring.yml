services:
  prometheus:
    build: ./prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prom_data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafanapass
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    restart: unless-stopped
    command:
      - "--mysqld.address=db:3306"
      - "--mysqld.username=exporter"
    environment:
      MYSQLD_EXPORTER_PASSWORD: exporterpass

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  grafana-configurator:
    profiles: ["configure"]
    build: ./grafana
    depends_on:
      - grafana
    environment:
      GF_URL: http://grafana:3000
      GF_USER: admin
      GF_PASS: grafanapass

volumes:
  prom_data:
  grafana_data:

networks:
  default:
    name: safeboard
    external: true
